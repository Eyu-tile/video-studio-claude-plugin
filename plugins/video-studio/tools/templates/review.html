<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark review room. Picture and timeline on the left, the comment thread on the right
   (stacked under the picture on phones). One accent: the amber of a grease-pencil marker on the timeline. */
:root {
  --bg: #121417;            /* room: neutral graphite, slightly cool, so the picture reads true */
  --panel: #191c20;
  --raised: #22262c;
  --line: #2d3239;
  --fg: #e6e8eb;
  --muted: #8b939e;
  --accent: #f0a640;        /* marker amber: comment pins, playhead */
  --accent-ink: #1a1306;
  --ok: #5cc28a;            /* resolved */
  --danger: #e5675c;
  --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-tc: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tc { font-family: var(--font-tc); font-variant-numeric: tabular-nums; letter-spacing: 0; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 12px; padding-block: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
header h1 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px;
  background: var(--raised); color: var(--muted); font-size: 12px; white-space: nowrap; }
.chip.v { color: var(--fg); }
.spacer { flex: 1; }
.btn { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; min-height: 0; }
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; min-height: 0; min-width: 0; }
.screen { position: relative; background: #000; border-radius: 10px; overflow: hidden; display: grid;
  place-items: center; min-height: 200px; }
.screen video { width: 100%; height: 100%; max-height: 100%; object-fit: contain; display: block; background: #000; }
.screen .bigplay { position: absolute; inset: auto; width: 64px; height: 64px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
.screen .bigplay svg { width: 26px; height: 26px; }
.overlay-note { position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; gap: 8px; align-items: flex-start;
  pointer-events: none; }
.overlay-note .bubble { max-width: 70%; background: rgba(18,20,23,.88); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; font-size: 13px; overflow-wrap: anywhere; }

/* timeline */
.timeline { position: relative; height: 54px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
  cursor: pointer; touch-action: none; user-select: none; overflow: visible; }
.strip { position: absolute; inset: 4px 4px 14px; border-radius: 4px; overflow: hidden; display: flex; opacity: .8; }
.strip span { flex: 1 1 0; background-repeat: no-repeat; min-width: 0; }
.played { position: absolute; left: 4px; top: 4px; bottom: 14px; background: rgba(240,166,64,.16); border-radius: 4px 0 0 4px;
  pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 10px; width: 2px; background: var(--accent); pointer-events: none;
  transform: translateX(-1px); }
.playhead::before { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 8px; background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 50% 100%); }
.pins { position: absolute; left: 4px; right: 4px; bottom: 0; height: 12px; }
.pin { position: absolute; bottom: 1px; height: 9px; min-width: 9px; border-radius: 5px; background: var(--accent);
  border: 1px solid var(--accent-ink); transform: translateX(-4px); padding: 0; }
.pin.resolved { background: var(--ok); opacity: .7; }
.pin.active { outline: 2px solid var(--fg); }
.hover { position: absolute; bottom: 60px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px; pointer-events: none; display: grid; gap: 4px; justify-items: center; z-index: 5; }
.hover .thumb { background-repeat: no-repeat; border-radius: 3px; }
.hover .tc { font-size: 11px; color: var(--fg); }

/* transport */
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: transparent;
  border: 1px solid transparent; }
.icon:hover { background: var(--raised); }
.icon svg { width: 18px; height: 18px; fill: currentColor; }
.clock { font-size: 13px; padding: 4px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.clock .of { color: var(--muted); }
select.btn { padding: 5px 6px; }
.keys { color: var(--muted); font-size: 12px; }

/* comments */
.thread { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.thread-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.thread-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--raised); color: var(--fg); }
.list { overflow-y: auto; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 120px; }
.empty { color: var(--muted); padding: 18px 10px; text-align: center; font-size: 13px; }
.c { border-radius: 8px; padding: 8px 10px; border: 1px solid transparent; display: grid; gap: 4px; }
.c:hover { background: var(--raised); }
.c.active { border-color: var(--accent); background: var(--raised); }
.c.resolved .body { color: var(--muted); }
.c .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.c .who { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px;
  font-weight: 600; color: #111; overflow: hidden; }
.dot img { width: 100%; height: 100%; object-fit: cover; }
.stamp { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
.c.resolved .stamp { background: var(--ok); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; }
.acts { display: flex; gap: 10px; }
.link { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; }
.link:hover { color: var(--fg); }
.replies { margin-left: 26px; display: grid; gap: 4px; border-left: 2px solid var(--line); padding-left: 10px; }

.composer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; }
.composer .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.toggle { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
textarea { width: 100%; min-height: 58px; max-height: 160px; resize: vertical; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; }
textarea:focus { border-color: var(--accent); outline: none; }
input.name { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; min-width: 0; flex: 1; }
.send-row { display: flex; align-items: center; gap: 8px; }
.status { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
.status.warn { color: var(--danger); }
.replying { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

@media (max-width: 880px) {
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .screen { max-height: 62vh; }
  .thread { max-height: none; }
  .list { max-height: 50vh; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header>
    <h1 id="title"></h1>
    <span class="chip v" id="version"></span>
    <span class="chip" id="meta"></span>
    <span class="spacer"></span>
    <span class="chip" id="counts">0 open</span>
    <button class="btn" id="copyNotes" type="button" title="Copy open comments as timestamped lines (vs notes format)">Copy notes</button>
    <button class="btn" id="exportCsv" type="button" title="Download comments as a Frame.io-style CSV">Export CSV</button>
  </header>

  <div class="main">
    <section class="stage" aria-label="Player">
      <div class="screen" id="screen">
        <video id="v" playsinline preload="metadata"></video>
        <button class="bigplay" id="bigplay" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <div class="overlay-note" id="onscreen" hidden><div class="bubble" id="onscreenText"></div></div>
      </div>

      <div class="timeline" id="tl" role="slider" tabindex="0" aria-label="Timeline" aria-valuemin="0">
        <div class="strip" id="strip"></div>
        <div class="played" id="played"></div>
        <div class="pins" id="pins"></div>
        <div class="playhead" id="ph"></div>
        <div class="hover" id="hover" hidden><div class="thumb" id="hoverThumb"></div><span class="tc" id="hoverTc"></span></div>
      </div>

      <div class="transport">
        <button class="icon" id="back" type="button" title="Back one frame (←)" aria-label="Back one frame">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="icon" id="play" type="button" title="Play / pause (Space)" aria-label="Play">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon" id="fwd" type="button" title="Forward one frame (→)" aria-label="Forward one frame">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <span class="clock tc"><span id="cur">00:00:00:00</span> <span class="of">/ <span id="dur">00:00:00:00</span></span></span>
        <select class="btn" id="rate" aria-label="Playback speed">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <button class="icon" id="mute" type="button" title="Mute (M)" aria-label="Mute">
          <svg viewBox="0 0 24 24" id="muteIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
        <button class="icon" id="full" type="button" title="Full screen (F)" aria-label="Full screen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        <span class="spacer"></span>
        <span class="keys">Space play · ←/→ frame · Shift ±1 s · C comment</span>
      </div>
    </section>

    <aside class="thread" aria-label="Comments">
      <div class="thread-head"><h2>Comments</h2><span class="spacer"></span><span class="chip" id="mode">Connecting…</span></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-f="open" aria-selected="true" type="button">Open</button>
        <button class="tab" role="tab" data-f="resolved" aria-selected="false" type="button">Resolved</button>
        <button class="tab" role="tab" data-f="all" aria-selected="false" type="button">All</button>
      </div>
      <div class="list" id="list"></div>
      <form class="composer" id="composer">
        <div class="replying" id="replying" hidden><span id="replyingText"></span><button class="link" id="cancelReply" type="button">Cancel</button></div>
        <div class="meta" id="stampRow">
          <button class="toggle tc" id="atBtn" type="button" aria-pressed="true" title="Pin this comment to the current frame">@ 00:00:00:00</button>
          <button class="toggle tc" id="outBtn" type="button" aria-pressed="false" title="Mark an end point at the playhead (a range)">+ end point</button>
          <input class="name" id="nameInput" placeholder="Your name" autocomplete="name" hidden>
        </div>
        <textarea id="text" placeholder="Leave a comment on this frame…" aria-label="Comment"></textarea>
        <div class="send-row"><span class="status" id="status"></span>
          <button class="btn primary" id="send" type="submit">Comment</button></div>
      </form>
    </aside>
  </div>
</div>

<script id="vs-config" type="application/json">__CONFIG__</script>
<script>
(() => {
  "use strict";
  const cfg = JSON.parse(document.getElementById("vs-config").textContent);
  const $ = (id) => document.getElementById(id);
  const v = $("v"), tl = $("tl");
  const FPS = cfg.fps || 25;
  let renderSeq = 0;                    // declared before anything can render
  const state = { comments: [], filter: "open", attach: true, out: null, replyTo: null, me: null, canWrite: true,
                  mode: "connecting", names: {} };

  // ---------- timecode ----------
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  const frameOf = (t) => Math.floor(t * FPS + 1e-4);
  function tc(t) {                      // HH:MM:SS:FF on real time: the frame within that second, so 27.0 s
    t = Math.max(0, t);                 // reads 00:00:27:00 at 29.97 fps too and matches the 0:27 in notes
    const s = Math.floor(t + 1e-6), fr = Math.min(Math.ceil(FPS) - 1, Math.floor((t - s) * FPS + 1e-4));
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}:${pad(fr)}`;
  }
  function short(t) {                   // 0:12.47 (what vs notes reads)
    const m = Math.floor(t / 60), s = (t - m * 60).toFixed(2).padStart(5, "0");
    return `${m}:${s}`;
  }
  function ago(ms) {
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    return new Date(ms).toLocaleDateString();
  }

  // ---------- header ----------
  $("title").textContent = cfg.title || "Review";
  $("version").textContent = cfg.version || "v1";
  $("meta").textContent = [cfg.client, cfg.task, cfg.length].filter(Boolean).join(" · ");
  $("meta").hidden = !$("meta").textContent;
  v.src = cfg.video;
  if (cfg.poster) v.poster = cfg.poster;

  // ---------- filmstrip ----------
  function buildStrip() {
    const s = cfg.strip;
    const el = $("strip");
    el.textContent = "";
    if (!s) return;
    const show = Math.max(4, Math.min(s.count, Math.round(tl.clientWidth / 64)));
    for (let i = 0; i < show; i++) {
      const k = Math.min(s.count - 1, Math.floor(i * s.count / show));
      const span = document.createElement("span");
      span.style.backgroundImage = `url("${s.src}")`;
      const scale = (el.clientHeight || 36) / s.h;
      span.style.backgroundSize = `${s.cols * s.w * scale}px auto`;
      span.style.backgroundPosition = `-${(k % s.cols) * s.w * scale}px -${Math.floor(k / s.cols) * s.h * scale}px`;
      el.appendChild(span);
    }
  }
  function hoverThumb(t) {
    const s = cfg.strip, th = $("hoverThumb");
    if (!s) { th.hidden = true; return; }
    const k = Math.min(s.count - 1, Math.max(0, Math.floor(t / s.interval)));
    const w = 160, scale = w / s.w;
    th.style.width = `${w}px`; th.style.height = `${s.h * scale}px`;
    th.style.backgroundImage = `url("${s.src}")`;
    th.style.backgroundSize = `${s.cols * s.w * scale}px auto`;
    th.style.backgroundPosition = `-${(k % s.cols) * s.w * scale}px -${Math.floor(k / s.cols) * s.h * scale}px`;
  }

  // ---------- player ----------
  const dur = () => (isFinite(v.duration) && v.duration > 0 ? v.duration : (cfg.duration || 0));
  function seek(t, pause = false) {
    const d = dur();
    v.currentTime = Math.max(0, Math.min(d ? d - 1 / FPS : t, t));
    if (pause) v.pause();
  }
  function step(frames) { v.pause(); seek((frameOf(v.currentTime) + frames) / FPS + 0.5 / FPS); }
  function togglePlay() { v.paused ? v.play().catch(() => {}) : v.pause(); }
  const playPath = "M8 5v14l11-7z", pausePath = "M6 5h4v14H6zm8 0h4v14h-4z";
  function syncPlay() {
    $("playIcon").firstElementChild.setAttribute("d", v.paused ? playPath : pausePath);
    $("play").setAttribute("aria-label", v.paused ? "Play" : "Pause");
    $("bigplay").hidden = !v.paused || v.currentTime > 0.05;
  }
  function tick() {
    const d = dur(), t = v.currentTime;
    $("cur").textContent = tc(t);
    $("dur").textContent = tc(d);
    const pct = d ? (t / d) : 0;
    const w = tl.clientWidth - 8;
    $("ph").style.left = `${4 + pct * w}px`;
    $("played").style.width = `${pct * w}px`;
    tl.setAttribute("aria-valuemax", d.toFixed(2)); tl.setAttribute("aria-valuenow", t.toFixed(2));
    tl.setAttribute("aria-valuetext", tc(t));
    if (state.attach && document.activeElement !== $("text")) $("atBtn").textContent = `@ ${tc(t)}`;
    $("bigplay").hidden = !v.paused || t > 0.05;
    highlight(t);
  }
  v.addEventListener("timeupdate", tick);
  v.addEventListener("seeked", tick);
  v.addEventListener("loadedmetadata", () => { tick(); renderPins(); });
  v.addEventListener("play", () => { syncPlay(); loop(); });
  v.addEventListener("pause", syncPlay);
  let raf = 0;
  function loop() { cancelAnimationFrame(raf); if (!v.paused) { tick(); raf = requestAnimationFrame(loop); } }
  $("play").onclick = togglePlay; $("bigplay").onclick = togglePlay;
  v.addEventListener("click", togglePlay);
  $("back").onclick = () => step(-1); $("fwd").onclick = () => step(1);
  $("rate").onchange = (e) => { v.playbackRate = +e.target.value; };
  $("mute").onclick = () => { v.muted = !v.muted; $("mute").style.opacity = v.muted ? .5 : 1; };
  $("full").onclick = () => { const el = $("screen"); (document.fullscreenElement ? document.exitFullscreen() :
    el.requestFullscreen?.())?.catch?.(() => {}); };

  // timeline scrub + hover
  function tAt(x) { const r = tl.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left - 4) / (r.width - 8))) * dur(); }
  let dragging = false;
  tl.addEventListener("pointerdown", (e) => { if (e.target.closest(".pin")) return; dragging = true;
    tl.setPointerCapture(e.pointerId); v.pause(); seek(tAt(e.clientX)); });
  tl.addEventListener("pointermove", (e) => {
    const t = tAt(e.clientX), hv = $("hover"), r = tl.getBoundingClientRect();
    hv.hidden = false; hv.style.left = `${Math.max(84, Math.min(r.width - 84, e.clientX - r.left))}px`;
    $("hoverTc").textContent = tc(t); hoverThumb(t);
    if (dragging) seek(t);
  });
  tl.addEventListener("pointerup", () => { dragging = false; });
  tl.addEventListener("pointerleave", () => { $("hover").hidden = true; });
  tl.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation();
      e.shiftKey ? seek(v.currentTime + (e.key === "ArrowLeft" ? -1 : 1), true) : step(e.key === "ArrowLeft" ? -1 : 1); }
  });

  // keyboard (not while typing)
  document.addEventListener("keydown", (e) => {
    const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || "");
    if (typing) { if (e.key === "Escape") document.activeElement.blur(); return; }
    if (e.key === " " || e.key === "k") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); e.shiftKey ? seek(v.currentTime - 1, true) : step(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); e.shiftKey ? seek(v.currentTime + 1, true) : step(1); }
    else if (e.key === "j") seek(v.currentTime - 1);
    else if (e.key === "l") seek(v.currentTime + 1);
    else if (e.key === "m") $("mute").click();
    else if (e.key === "f") $("full").click();
    else if (e.key === "c") { e.preventDefault(); $("text").focus(); }
  });

  // ---------- storage: shared db when published on claude.ai, this browser otherwise ----------
  const LKEY = `vs-review:${cfg.id || cfg.video}`;
  const local = {
    read() { try { return JSON.parse(localStorage.getItem(LKEY) || "[]"); } catch { return []; } },
    write(rows) { try { localStorage.setItem(LKEY, JSON.stringify(rows)); return true; } catch { return false; } },
  };
  let store = null;
  function setMode(mode, text) { state.mode = mode; $("mode").textContent = text; }
  function setStatus(msg, warn = false) { const s = $("status"); s.textContent = msg; s.classList.toggle("warn", warn); }

  function useLocal(reason) {
    let mem = local.read();
    const persisted = local.write(mem);
    const save = () => { local.write(mem); state.comments = mem; render(); };
    store = {
      add: async (c) => { c.id = `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`; mem = [...mem, c]; save(); },
      update: async (id, patch) => { mem = mem.map((c) => c.id === id ? { ...c, ...patch } : c); save(); },
      remove: async (id) => { mem = mem.filter((c) => c.id !== id && c.parent !== id); save(); },
    };
    state.comments = mem;
    setMode("local", persisted ? "Saved in this browser" : "Not saved (private window)");
    $("nameInput").hidden = false;
    try { $("nameInput").value = localStorage.getItem("vs-review:name") || ""; } catch { /* storage blocked */ }
    if (reason) setStatus(reason);
    render();
  }

  async function useDb(db, user) {
    const col = db.collection("comments");
    store = {
      add: async (c) => { await col.add(c); },
      update: async (id, patch) => { await col.doc(id).update(patch); },
      remove: async (id) => {
        for (const r of state.comments.filter((c) => c.parent === id)) await col.doc(r.id).delete();
        await col.doc(id).delete();
      },
    };
    if (user) {
      const me = await user.me();
      state.me = me.id;
      const can = await user.can("data.write");
      state.canWrite = can !== false;
    }
    setMode("db", state.canWrite ? "Shared · live" : "View only");
    if (!state.canWrite) { $("composer").querySelectorAll("textarea,button").forEach((b) => b.disabled = true);
      setStatus("You can watch and read comments. Ask the owner for Contributor access to comment."); }
    const timer = setTimeout(() => setStatus("Comments can't be reached yet. They'll appear when the connection returns.", true), 10000);
    col.onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      state.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => { clearTimeout(timer); setStatus(`Comments stopped updating (${err.code}). Reload the page to reconnect.`, true); });
  }

  (async () => {
    const use = window.claude && window.claude.use;
    if (!use) { useLocal("Opened as a file: comments stay in this browser. Export CSV to send them."); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch { db = null; }
    if (!db) { useLocal("Shared comments are not available here: they stay in this browser. Export CSV to send them."); return; }
    useDb(db, user).catch(() => useLocal("Could not open shared comments; they stay in this browser."));
  })();

  // ---------- render ----------
  async function names(ids) {
    const u = window.claude && window.claude.use ? await window.claude.use("user").catch(() => null) : null;
    if (!u || !ids.length) return {};
    return u.profiles(ids);
  }
  function initials(name) { return (name || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }

  async function render() {
    const seq = ++renderSeq;
    const all = state.comments.slice();
    const tops = all.filter((c) => !c.parent).sort((a, b) => (a.t ?? 0) - (b.t ?? 0) || a.created - b.created);
    const open = tops.filter((c) => !c.resolved).length;
    $("counts").textContent = `${open} open · ${tops.length - open} resolved`;
    const ids = [...new Set(all.map((c) => c.by).filter(Boolean))];
    const ps = state.mode === "db" ? await names(ids) : {};
    if (seq !== renderSeq) return;
    const show = tops.filter((c) => state.filter === "all" || (state.filter === "open" ? !c.resolved : c.resolved));
    const list = $("list");
    list.textContent = "";
    if (!show.length) {
      const e = document.createElement("div"); e.className = "empty";
      e.textContent = tops.length ? "Nothing here. Switch tabs to see the rest."
        : "No comments yet. Pause on a frame, type below, and press Enter. Your comment is pinned to that frame.";
      list.appendChild(e);
    }
    for (const c of show) list.appendChild(card(c, ps, all.filter((r) => r.parent === c.id).sort((a, b) => a.created - b.created)));
    renderPins(tops);
    highlight(v.currentTime);
  }

  function person(c, ps) {
    const p = c.by ? ps[c.by] : null;
    const name = (p && p.name) || c.byName || (c.by && c.by === state.me ? "You" : "Reviewer");
    return { name, avatar: p && p.avatarUrl, color: (p && p.color) || "#8b939e" };
  }
  function card(c, ps, replies) {
    const el = document.createElement("div");
    el.className = "c" + (c.resolved ? " resolved" : "");
    el.dataset.id = c.id;
    const who = person(c, ps);
    const row = document.createElement("div"); row.className = "row";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = who.color;
    if (who.avatar) { const im = document.createElement("img"); im.src = who.avatar; im.alt = ""; dot.appendChild(im); }
    else dot.textContent = initials(who.name);
    const name = document.createElement("span"); name.className = "who"; name.textContent = who.name;
    row.append(dot, name);
    if (typeof c.t === "number") {
      const st = document.createElement("button"); st.type = "button"; st.className = "stamp tc";
      st.textContent = tc(c.t) + (typeof c.te === "number" ? ` → ${tc(c.te)}` : "");
      st.title = "Go to this frame"; st.onclick = () => { seek(c.t, true); };
      row.append(st);
    }
    const when = document.createElement("span"); when.className = "when"; when.textContent = ago(c.created || Date.now());
    row.append(when);
    const body = document.createElement("div"); body.className = "body"; body.textContent = c.text;
    const acts = document.createElement("div"); acts.className = "acts";
    if (state.canWrite) {
      acts.append(action(c.resolved ? "Reopen" : "Resolve", () => store.update(c.id, { resolved: !c.resolved }).catch(fail)),
        action("Reply", () => startReply(c, who.name)));
      if (state.mode !== "db" || !c.by || c.by === state.me) acts.append(action("Delete", () => confirmDelete(el, c)));
    }
    el.append(row, body, acts);
    if (replies.length) {
      const box = document.createElement("div"); box.className = "replies";
      for (const r of replies) {
        const rw = person(r, ps);
        const re = document.createElement("div"); re.className = "c";
        const rr = document.createElement("div"); rr.className = "row";
        const n = document.createElement("span"); n.className = "who"; n.textContent = rw.name;
        const w = document.createElement("span"); w.className = "when"; w.textContent = ago(r.created || Date.now());
        rr.append(n, w);
        const rb = document.createElement("div"); rb.className = "body"; rb.textContent = r.text;
        re.append(rr, rb);
        box.append(re);
      }
      el.append(box);
    }
    el.addEventListener("click", (e) => { if (e.target === el || e.target === body) { if (typeof c.t === "number") seek(c.t, true); } });
    return el;
  }
  function action(label, fn) { const b = document.createElement("button"); b.type = "button"; b.className = "link"; b.textContent = label; b.onclick = fn; return b; }
  function confirmDelete(el, c) {               // no confirm() in the viewer: ask inline
    const acts = el.querySelector(".acts"); acts.textContent = "";
    const q = document.createElement("span"); q.className = "when"; q.textContent = "Delete this comment?";
    acts.append(q, action("Delete", () => store.remove(c.id).catch(fail)), action("Keep", () => render()));
  }
  function fail(e) { setStatus(e && e.code === "invalid_argument" ? "You don't have permission to change this." :
    e && e.code === "quota_exceeded" ? "This review is full. Delete old comments to add more." : "That didn't save. Try again.", true); }

  function renderPins(tops) {
    tops = tops || state.comments.filter((c) => !c.parent);
    const d = dur(), box = $("pins"); box.textContent = "";
    if (!d) return;
    for (const c of tops) {
      if (typeof c.t !== "number") continue;
      const b = document.createElement("button"); b.type = "button";
      b.className = "pin" + (c.resolved ? " resolved" : ""); b.dataset.id = c.id;
      b.style.left = `${(c.t / d) * 100}%`;
      if (typeof c.te === "number" && c.te > c.t) b.style.width = `calc(${((c.te - c.t) / d) * 100}% + 9px)`;
      b.title = `${tc(c.t)}  ${c.text.slice(0, 80)}`;
      b.setAttribute("aria-label", `Comment at ${tc(c.t)}`);
      b.onclick = (e) => { e.stopPropagation(); seek(c.t, true); };
      box.appendChild(b);
    }
  }
  function highlight(t) {
    let hit = null;
    for (const c of state.comments) {
      if (c.parent || typeof c.t !== "number") continue;
      const end = typeof c.te === "number" ? c.te : c.t + 1.5;
      const on = t >= c.t - 0.5 / FPS && t <= end;
      document.querySelector(`.c[data-id="${c.id}"]`)?.classList.toggle("active", on);
      document.querySelector(`.pin[data-id="${c.id}"]`)?.classList.toggle("active", on);
      if (on && !c.resolved && !hit) hit = c;
    }
    const ov = $("onscreen");
    ov.hidden = !hit;
    if (hit) $("onscreenText").textContent = hit.text;
  }

  // ---------- composer ----------
  $("text").addEventListener("focus", () => { v.pause(); if (state.attach) $("atBtn").textContent = `@ ${tc(v.currentTime)}`; });
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
  });
  $("atBtn").onclick = () => { state.attach = !state.attach; $("atBtn").setAttribute("aria-pressed", state.attach);
    $("atBtn").textContent = state.attach ? `@ ${tc(v.currentTime)}` : "No time (general note)"; if (!state.attach) clearOut(); };
  $("outBtn").onclick = () => {
    if (state.out !== null) { clearOut(); return; }
    state.out = v.currentTime; $("outBtn").setAttribute("aria-pressed", "true"); $("outBtn").textContent = `→ ${tc(state.out)}`;
  };
  function clearOut() { state.out = null; $("outBtn").setAttribute("aria-pressed", "false"); $("outBtn").textContent = "+ end point"; }
  function startReply(c, name) {
    state.replyTo = c.id; $("replying").hidden = false; $("replyingText").textContent = `Replying to ${name}`;
    $("stampRow").hidden = true; $("text").placeholder = "Write a reply…"; $("text").focus();
  }
  function endReply() { state.replyTo = null; $("replying").hidden = true; $("stampRow").hidden = false;
    $("text").placeholder = "Leave a comment on this frame…"; }
  $("cancelReply").onclick = endReply;
  document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
    state.filter = b.dataset.f;
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === b));
    render();
  });

  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text || !store) return;
    const c = { text, created: Date.now(), resolved: false, version: cfg.version || null };
    if (state.replyTo) c.parent = state.replyTo;
    else if (state.attach) {
      let t = v.currentTime, te = state.out;
      if (te !== null && te < t) [t, te] = [te, t];
      c.t = Math.round(t * 1000) / 1000; c.frame = frameOf(t);
      if (te !== null && te > t) c.te = Math.round(te * 1000) / 1000;
    }
    if (state.mode === "db") { if (state.me) c.by = state.me; }
    else { const n = $("nameInput").value.trim(); if (n) { c.byName = n; try { localStorage.setItem("vs-review:name", n); } catch { /* ok */ } } }
    $("send").disabled = true;
    try { await store.add(c); $("text").value = ""; clearOut(); endReply(); setStatus(state.mode === "db" ? "Comment posted." : "Comment saved in this browser."); }
    catch (err) { fail(err); }
    finally { $("send").disabled = !state.canWrite; }
  });

  // ---------- export ----------
  function rowsForExport() {
    const all = state.comments, tops = all.filter((c) => !c.parent).sort((a, b) => (a.t ?? 0) - (b.t ?? 0));
    return tops.map((c, i) => ({ n: i + 1, c, replies: all.filter((r) => r.parent === c.id) }));
  }
  const nameOf = (c) => c.byName || (c.by && c.by === state.me ? "You" : "Reviewer");
  function csv() {
    const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
    // "Time" (seconds) comes first: vs notes reads the first time-like column, and real seconds are exact at any fps
    const out = [["#", "Time", "End", "Timecode", "Frame", "Commenter", "Comment", "Status", "Replies"].join(",")];
    for (const { n, c, replies } of rowsForExport()) {
      out.push([n, q(typeof c.t === "number" ? short(c.t) : ""), q(typeof c.te === "number" ? short(c.te) : ""),
        q(typeof c.t === "number" ? tc(c.t) : ""), typeof c.t === "number" ? frameOf(c.t) : "",
        q(nameOf(c)), q(c.text), c.resolved ? "Completed" : "Open",
        q(replies.map((r) => `${nameOf(r)}: ${r.text}`).join(" | "))].join(","));
    }
    return out.join("\n") + "\n";
  }
  function notes(openOnly = true) {
    return rowsForExport().filter(({ c }) => !openOnly || !c.resolved).map(({ c, replies }) => {
      const at = typeof c.t === "number" ? short(c.t) + (typeof c.te === "number" ? `-${short(c.te)}` : "") + " " : "";
      const extra = replies.length ? ` [replies: ${replies.map((r) => r.text).join(" / ")}]` : "";
      return `${at}${c.text.replace(/\s*\n\s*/g, " ")}${extra}`;
    }).join("\n");
  }
  $("copyNotes").onclick = async () => {
    const txt = notes(true);
    if (!txt) { setStatus("No open comments to copy."); return; }
    try { await navigator.clipboard.writeText(txt); setStatus("Open comments copied. Paste them to Claude or into vs notes."); }
    catch { $("text").value = txt; $("text").select(); setStatus("Copy blocked here: the notes are in the box, selected. Copy them from there."); }
  };
  $("exportCsv").onclick = async () => {
    const file = `${(cfg.slug || "review")}-${cfg.version || "v1"}-comments.csv`;
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename: file, data: csv() }); setStatus("CSV saved."); }
      catch (e) { setStatus(e && e.code === "declined" ? "Download cancelled." : "Download isn't available here. Use Copy notes.", e && e.code !== "declined"); }
      return;
    }
    if (window.claude && window.claude.use) { setStatus("Download isn't available here. Use Copy notes."); return; }
    const a = document.createElement("a");                       // opened as a local file: a normal download works
    a.href = URL.createObjectURL(new Blob([csv()], { type: "text/csv" })); a.download = file;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus("CSV downloaded.");
  };

  window.addEventListener("resize", () => { buildStrip(); tick(); });
  buildStrip(); tick(); syncPlay(); render();
})();
</script>
